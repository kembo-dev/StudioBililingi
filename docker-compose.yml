services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studiobililingi}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: studiobililingi
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_BACKENDS: stub
      PYTHONPATH: /app:/agents:/packages
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python manage.py makemigrations --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: studiobililingi
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      REDIS_URL: redis://redis:6379/0
      STUDIO_BACKENDS: stub
      PYTHONPATH: /app:/agents:/packages
    volumes:
      - ./backend:/app
      - ./agents:/agents
      - ./packages:/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A config worker -l info

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  studio_pg:
